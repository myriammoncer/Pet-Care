name: petcare
description: Application mobile de gestion et de services pour animaux de compagnie.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Gestion d'état
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Réseau
  dio: ^5.5.0

  # Stockage sécurisé (tokens JWT)
  flutter_secure_storage: ^9.2.2

  # Modèles immuables + JSON
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Divers
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Génération de code (freezed / json_serializable)
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
