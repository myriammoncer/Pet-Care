# Environnement de développement local : MongoDB + interface d'admin.
# Usage : docker compose up -d
services:
  mongodb:
    image: mongo:7.0
    container_name: petcare-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: petcare
      MONGO_INITDB_ROOT_PASSWORD: petcare
      MONGO_INITDB_DATABASE: petcare
    volumes:
      - mongo_data:/data/db

  # Interface web pour visualiser la base — http://localhost:8081
  mongo-express:
    image: mongo-express:1.0.2
    container_name: petcare-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: petcare
      ME_CONFIG_MONGODB_ADMINPASSWORD: petcare
      ME_CONFIG_MONGODB_URL: mongodb://petcare:petcare@mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb

volumes:
  mongo_data:
