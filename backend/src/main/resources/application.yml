# Configuration par défaut de l'API Pet-Care.
# Les profils (local, dev, prod) surchargent ces valeurs.
spring:
  application:
    name: petcare-backend
  profiles:
    active: local
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://petcare:petcare@localhost:27017/petcare?authSource=admin}
      auto-index-creation: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

# Paramètres applicatifs personnalisés
petcare:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-production-this-secret-must-be-at-least-256-bits-long}
      access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}      # 15 minutes
      refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000} # 7 jours
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://10.0.2.2:*}

# Documentation OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Actuator (monitoring)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.petcare: INFO
    org.springframework.data.mongodb: INFO
